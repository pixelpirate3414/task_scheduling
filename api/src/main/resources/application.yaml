spring:
  application:
    name: api
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/task_scheduler}
    username: ${POSTGRES_USER:task_scheduler}
    password: ${POSTGRES_PASSWORD:task_scheduler}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
  config:
    import: optional:file:.env[.properties]

app:
  jwt:
    secret: ${JWT_SECRET}
