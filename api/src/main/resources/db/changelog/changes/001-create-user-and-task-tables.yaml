databaseChangeLog:
  - changeSet:
      id: 001-create-user-and-task-tables
      author: task-scheduler
      changes:
        - createSequence:
            sequenceName: user_sequence
            startValue: 1
            incrementBy: 50
            dataType: bigint
        - createSequence:
            sequenceName: task_sequence
            startValue: 1
            incrementBy: 50
            dataType: bigint
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: varchar(2048)
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: done_at
                  type: timestamp with time zone
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_owner
